<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the
      // wrong background. Defaults to light; falls back to the OS preference.
      (function () {
        try {
          var theme = localStorage.getItem('digitalsmm:theme')
          var dark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#050816' : '#f6f7fb')
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="DigitalSMM — The #1 Cambodia Social Media Marketing Platform. Boost TikTok, Facebook, Instagram, YouTube and Telegram with fast, affordable and secure delivery."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DigitalSMM — Cambodia Social Media Marketing" />
    <meta
      property="og:description"
      content="Fast delivery, real-time tracking and secure KHQR payments for your social media growth."
    />
    <meta property="og:site_name" content="DigitalSMM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DigitalSMM — Cambodia Social Media Marketing" />
    <meta
      name="twitter:description"
      content="Fast delivery, real-time tracking and secure KHQR payments for your social media growth."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>DigitalSMM — #1 Cambodia Social Media Marketing Platform</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
