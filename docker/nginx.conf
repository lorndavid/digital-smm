# Shared nginx config for the VidSMM customer app (frontend) and admin panel.
# Mounted read-only into both containers via docker-compose.yml.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Built assets are content-hashed — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — client-side routing owns all other paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API, proxied same-origin.
    # IMPORTANT: SSE (/api/payment/events) must NEVER be buffered — the
    # payment page streams live KHQR status through this proxy. Buffering
    # would freeze it on "Waiting for payment" until the connection flush.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Provider webhooks (CutLuy etc.) — same non-buffered treatment.
    location /webhooks/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
