# Shared nginx config for the VidSMM customer app (frontend) and admin panel.
# Mounted read-only into both containers via docker-compose.yml.

# ---------------------------------------------------------------------------
# Dynamic backend upstream — makes scaling a config change.
#
# Docker's embedded DNS (127.0.0.11) resolves the `backend` service name to
# ALL of its container IPs. `server backend:4000 resolve;` (nginx >= 1.27.3)
# re-resolves that name every `valid` window and registers every returned
# address as an upstream server, so nginx round-robins requests across all
# replicas started with `docker compose up --scale backend=N`.
#
# Works for N = 1 too (single IP → single upstream server → previous
# behaviour). Scale up or down any time; no nginx reload, no code change.
# ---------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:4000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Built assets are content-hashed — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — client-side routing owns all other paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API, proxied same-origin through the dynamic upstream above.
    # IMPORTANT: SSE (/api/payment/events) must NEVER be buffered — the
    # payment page streams live KHQR status through this proxy. Buffering
    # would freeze it on "Waiting for payment" until the connection flush.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Provider webhooks (CutLuy etc.) — same non-buffered treatment.
    location /webhooks/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
