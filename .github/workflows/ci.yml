# DigitalSMM CI — fast feedback on every PR/push: typecheck, unit tests, and a
# real-browser e2e that proves the KHQR payment auto-success flow works.
#
#   job `test`          → typecheck (backend + frontend + admin) + hermetic
#                         unit/API tests. Runs in seconds, no services.
#   job `browser-test`  → Playwright e2e against the REAL backend + browser:
#                         Google-auth landing states, ABA deep links, and the
#                         payment page auto-showing success via SSE (no
#                         refresh, no polling) when a signed CutLuy webhook
#                         fires. Mongo provided as a service.
#
# The heavy 100-user load tests (single + multi-instance, Redis relay) are
# NOT run automatically — they are intentionally manual. Trigger them from
# GitHub → Actions → "Load tests (manual)" when you need scale validation.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspaces (single lockfile)
        run: npm ci

      - name: Typecheck (backend + frontend + admin)
        run: npm run typecheck

      - name: Hermetic unit & API tests
        run: npm test

  browser-test:
    name: Browser test (payment auto-success via SSE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      # The Playwright webServer boots its own backend on :4001 (mock
      # providers, throwaway DB derived from MONGODB_URI) + frontend :5199.
      MONGODB_URI: mongodb://127.0.0.1:27017/vidsmm_e2e
      CUSTOMER_JWT_SECRET: ci-customer-jwt-secret-0123456789
      ADMIN_JWT_SECRET: ci-admin-jwt-secret-0123456789
      RATE_LIMIT_MAX: 100000
      RATE_LIMIT_WINDOW_MS: 600000
      DNS_SERVERS: ""
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspaces (single lockfile)
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser test — KHQR auto-success via SSE, no refresh
        working-directory: frontend
        run: npm run test:e2e
        timeout-minutes: 15
