# Frontend production deploy verification + Telegram notifications.
#
# The customer frontend is deployed by the Vercel GitHub integration when
# code lands on `main` (Vercel auto-deploys). This workflow waits for the
# deploy, smoke-tests the production URL, and notifies Telegram on success
# or failure — without duplicating the Vercel build (Vercel owns it).
#
# MANUAL REQUIRED:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — GitHub Actions secrets.
#   Verify the Vercel GitHub app has access to this repo (private repos need
#   it) and that VITE_API_BASE_URL is set on the Vercel project.
name: Frontend Deploy (verify + notify)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'frontend/vercel.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel deploy to settle
        run: sleep 120

      - name: Smoke test production URL
        id: smoke
        continue-on-error: true
        env:
          PROD_URL: ${{ vars.FRONTEND_PROD_URL || 'https://digitalsmm.shop' }}
        run: |
          code=$(curl -sS -L -o /dev/null -w '%{http_code}' -m 30 "$PROD_URL" || echo 000)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "::error::Frontend smoke test failed: HTTP $code from $PROD_URL"
            exit 1
          fi
          echo "Frontend is live: $PROD_URL → HTTP $code"

      - name: Notify result
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.smoke.outcome }}" == "success" ]; then
            node scripts/notify-telegram.mjs "🟢 DigitalSMM Frontend deployed — commit ${GITHUB_SHA:0:12} (${{ vars.FRONTEND_PROD_URL || 'https://digitalsmm.shop' }})"
          else
            node scripts/notify-telegram.mjs "🔴 DigitalSMM Frontend deploy check FAILED — commit ${GITHUB_SHA:0:12}. See GitHub Actions."
          fi
