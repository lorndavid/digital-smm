# Security scanning — runs on every PR and push to main:
#   1. gitleaks: scan the full history for accidentally committed secrets
#      (API keys, tokens, private keys, JWT secrets, payment credentials).
#   2. npm audit: dependency vulnerabilities across the workspaces.
#
# Findings never print the secret values — they are redacted by the tools.
#
# MANUAL REQUIRED:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — to notify when a scan fails.
name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependencies:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  notify:
    name: Notify on scan failure
    if: failure()
    needs: [secrets, dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/notify-telegram.mjs "🔴 DigitalSMM Security scan found issues — commit ${GITHUB_SHA:0:12}. See GitHub Actions → Security Scan."
